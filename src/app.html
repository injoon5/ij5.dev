<!doctype html>
<html lang="en" class="antialiased">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- A second manifest for dark-mode installs: Chrome picks the one whose
		     media query matches, so an install made in dark mode gets dark
		     chrome instead of a light splash. iOS ignores manifests entirely and
		     is covered by the theme-color metas. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link
			rel="manifest"
			media="(prefers-color-scheme: dark)"
			href="/manifest-dark.webmanifest"
		/>
		<link
			rel="preload"
			href="/fonts/interlude-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
